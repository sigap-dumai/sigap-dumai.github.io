<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SiGap Dumai – Notifikasi</title>

    <link rel="stylesheet" href="/assets/css/dashboard.css" />
    <link rel="stylesheet" href="/assets/css/notifikasi.css" />
</head>

<body>
<div class="app-shell">
    <!-- HEADER -->
    <header class="app-header">
        <div class="app-header-left">
            <button class="back-button" onclick="window.location.href='/dashboard.html'">←</button>
            <div class="app-title">
                <span class="app-name">Notifikasi</span>
                <span class="app-subtitle">Peringatan & Informasi Terbaru</span>
            </div>
        </div>
    </header>

    <!-- MAIN -->
    <main class="notif-main">
        <!-- FILTER -->
        <section class="notif-filter">
            <button class="filter-button active" data-filter="all">Semua</button>
            <button class="filter-button" data-filter="warning">Peringatan</button>
            <button class="filter-button" data-filter="info">Informasi</button>
            <button class="filter-button" data-filter="edu">Edukasi</button>
        </section>

        <!-- LIST NOTIFIKASI -->
        <section id="notif-list" class="notif-list">
            <!-- Isi otomatis dari notifikasi.js -->
        </section>
    </main>

    <!-- NAV -->
    <nav class="bottom-nav">
        <a href="/dashboard.html" class="nav-item">
            <span class="nav-label">Dasbor</span>
        </a>
        <a href="/informasi.html" class="nav-item">
            <span class="nav-label">Informasi/SOP</span>
        </a>
        <a href="/laporan.html" class="nav-item">
            <span class="nav-label">Lapor</span>
        </a>
    </nav>
</div>

<!-- JS -->
<script src="/assets/js/notifikasi.js"></script>
</body>
</html>
