<!DOCTYPE html>
<html lang="id">
<head>
    <base href=".">
    <title>Login Petugas - SIGAP Dumai</title>
    <link rel="icon" type="image/png" href="assets/img/sigap_dumai.png">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/main.css">
    <style>
        .full-screen-center {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f8f9fa;
        }
    </style>
</head>
<body class="full-screen-center">
    <div class="card p-4 border-0 shadow" style="width: 320px;">
        <div class="text-center mb-4">
            <img src="assets/img/dumai_idaman.png" alt="Dumai Idaman" style="width: 150px; margin-bottom: 15px;" onerror="this.style.display='none'">
            <h5 class="fw-bold">Login Petugas</h5>
            <small class="text-muted">Akses Terbatas TRC</small>
        </div>
        <form id="formLogin">
            <div class="mb-2">
                <input type="text" id="username" class="form-control" placeholder="Username (ex: kalaksa)" required>
            </div>
            <div class="mb-3">
                <input type="password" id="password" class="form-control" placeholder="Password" required>
            </div>
            <button class="btn btn-primary w-100">MASUK</button>
        </form>
        <a href="index.html" class="text-center d-block mt-3 text-decoration-none small text-muted">← Kembali ke Dasbor</a>
    </div>
    <script src="assets/js/modules/auth.js"></script>
</body>
</html>
