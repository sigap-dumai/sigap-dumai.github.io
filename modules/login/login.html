<!-- modules/login/login.html -->
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SiGap Dumai</title>
    <!-- Path CSS yang benar berdasarkan struktur repo -->
    <link rel="stylesheet" href="../../assets/css/styles.css"> <!-- Path CSS yang benar -->
</head>
<body>
    <div class="login-container">
        <h2>Login SiGap Dumai</h2>
        <form id="login-form">
            <div class="form-group">
                <label for="username">Username:</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit" class="login-btn">Login</button>
        </form>
    </div>

    <!-- Memanggil script login.js yang ada di folder login -->
    <script src="login.js"></script> <!-- Path JS yang benar -->
</body>
</html>
