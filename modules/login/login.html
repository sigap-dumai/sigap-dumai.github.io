<!-- modules/login/login.html -->
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - SiGap Dumai</title>
  <link rel="stylesheet" href="../../assets/css/styles.css"> <!-- Mengarah ke CSS -->
  <!-- Memuat Font Roboto -->
  <link rel="stylesheet" href="../../assets/css/fonts.css">
</head>
<body>
  <!-- Memuat Header -->
  <div id="header-placeholder"></div>

  <div class="login-container">
    <h1>Login SiGap Dumai</h1>
    <form id="login-form" action="javascript:void(0)">
      <input type="text" id="username" placeholder="Username" required>
      <input type="password" id="password" placeholder="Password" required>
      <button type="submit" id="login-btn">Login</button>
    </form>
    <p id="login-error" style="color: red; display: none;">Username atau password salah.</p>
  </div>

  <!-- Memuat Footer -->
  <div id="footer-placeholder"></div>

  <script src="../../assets/js/main.js"></script> <!-- Mengarah ke JS -->
  <script>
    // Fungsi untuk memuat header dan footer
    function loadHeaderAndFooter() {
      // Memuat header
      fetch('../../partials/header.html')
        .then(response => response.text())
        .then(html => {
          document.getElementById('header-placeholder').innerHTML = html;
        })
        .catch(err => console.error('Gagal memuat header:', err));

      // Memuat footer
      fetch('../../partials/footer.html')
        .then(response => response.text())
        .then(html => {
          document.getElementById('footer-placeholder').innerHTML = html;
        })
        .catch(err => console.error('Gagal memuat footer:', err));
    }

    loadHeaderAndFooter(); // Panggil fungsi untuk memuat header dan footer

    // Menangani proses login
    document.getElementById('login-form').addEventListener('submit', function(e) {
      e.preventDefault();

      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      // Ambil data pengguna dari users.json
      fetch('../../json/users.json')
        .then(response => response.json())
        .then(users => {
          const user = users.find(user => user.username === username && user.password === password);
          
          if (user) {
            // Menyimpan data login pengguna
            localStorage.setItem('loggedIn', 'true');  
            localStorage.setItem('username', username);  // Menyimpan username
            localStorage.setItem('role', user.role);     // Menyimpan role pengguna

            // Redirect ke halaman utama setelah login sukses
            window.location.href = '../../index.html'; 
          } else {
            // Menampilkan error jika login gagal
            document.getElementById('login-error').style.display = 'block'; 
          }
        })
        .catch(err => {
          console.error('Terjadi kesalahan saat mengambil data pengguna:', err);
        });
    });
  </script>
</body>
</html>
