<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SiGap-Dumai</title>
    <link href="/assets/fonts/Roboto-VariableFont_wdth,wght.ttf" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/styles.css">
</head>
<body>
    <section class="login-container">
        <div class="login-content">
            <h1>Masuk ke SiGap-Dumai</h1>
            <form id="loginForm">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required>

                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>

                <button type="submit" class="login-btn">Masuk</button>
            </form>
            <p id="error-message" style="color: red; display: none;">Username atau Password salah.</p>
        </div>
    </section>

    <footer id="footer-container"></footer>
    <script src="/assets/js/main.js"></script>
</body>
</html>
