<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Laporan - SiGap-Dumai</title>
    <link rel="stylesheet" href="../../assets/css/styles.css">
</head>
<body>
    <div id="header-container"></div>

    <main>
        <h2>Laporan Kejadian Bencana</h2>
        <table>
            <tr>
                <th>Lokasi</th>
                <th>Deskripsi</th>
                <th>Waktu</th>
            </tr>
            <!-- Data laporan akan ditampilkan di sini -->
        </table>
    </main>

    <div id="footer-container"></div>

    <script>
        // Menyisipkan header dan footer dari partials
        fetch('../../partials/header.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById("header-container").innerHTML = data;
            });

        fetch('../../partials/footer.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById("footer-container").innerHTML = data;
            });

        // Cek apakah pengguna adalah admin
        const currentUser = JSON.parse(localStorage.getItem('user'));
        if (currentUser && currentUser.role !== 'admin_kecamatan') {
            alert('Akses ditolak, hanya admin yang dapat melihat laporan.');
            window.location.href = "../../modules/login/login.html";
        } else {
            // Fetch dan tampilkan laporan admin
            fetch('../../json/reports.json')
                .then(response => response.json())
                .then(reports => {
                    const table = document.querySelector('table');
                    reports.forEach(report => {
                        const row = table.insertRow();
                        row.insertCell(0).textContent = report.lokasi;
                        row.insertCell(1).textContent = report.deskripsi;
                        row.insertCell(2).textContent = report.waktu;
                    });
                });
        }
    </script>
</body>
</html>
