<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laporan Kejadian - SiGap Dumai</title>
    <!-- Link ke Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
    <!-- Link ke CSS halaman -->
    <link rel="stylesheet" href="../../assets/css/styles.css">
</head>
<body>
    <header>
        <div class="user-info">
            <span id="user-name"></span>
            <button id="logout-btn" onclick="logout()">Logout</button>
        </div>
    </header>

    <div class="report-content">
        <h1>Laporan Kejadian</h1>
        
        <!-- Form Laporan -->
        <form id="report-form">
            <label for="name">Nama:</label>
            <input type="text" id="name" name="name" required>

            <label for="phone">Nomor HP:</label>
            <input type="text" id="phone" name="phone" required>

            <label for="details">Detail Kejadian:</label>
            <textarea id="details" name="details" rows="4" required></textarea>

            <!-- Koordinat dan Lokasi -->
            <div id="location-info">
                <p>Koordinat: <span id="coordinates">Menunggu lokasi...</span></p>
                <p>Kelurahan: <span id="kelurahan">-</span></p>
                <p>Kecamatan: <span id="kecamatan">-</span></p>
            </div>

            <button type="submit" class="btn">Kirim Laporan</button>
        </form>

        <!-- Peta Lokasi -->
        <div id="map" style="height: 400px;"></div>
    </div>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script>
        // Tampilkan nama user yang login
        document.getElementById('user-name').textContent = 'Hello, ' + localStorage.getItem('loggedInUser');

        // Fungsi untuk logout
        function logout() {
            localStorage.removeItem('loggedInUser');
            localStorage.removeItem('userRole');
            window.location.href = '/modules/login/login.html';
        }

        // Inisialisasi peta
        const map = L.map('map').setView([1.644, 104.526], 10); // Koordinat pusat peta, sesuaikan dengan lokasi yang relevan

        // Menambahkan layer peta dari OpenStreetMap
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        // Fungsi untuk mendapatkan lokasi
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(function(position) {
                const latitude = position.coords.latitude;
                const longitude = position.coords.longitude;

                // Tampilkan lokasi pada peta
                L.marker([latitude, longitude]).addTo(map)
                    .bindPopup('Lokasi Anda: ' + latitude + ', ' + longitude)
                    .openPopup();

                // Pindahkan peta ke lokasi pelapor
                map.setView([latitude, longitude], 13);

                // Tampilkan koordinat di halaman
                document.getElementById('coordinates').textContent = latitude + ', ' + longitude;

                // Gunakan geocoding untuk mendapatkan nama kelurahan dan kecamatan
                const geocodeUrl = `https://nominatim.openstreetmap.org/reverse?lat=${latitude}&lon=${longitude}&format=json&addressdetails=1`;
                fetch(geocodeUrl)
                    .then(response => response.json())
                    .then(data => {
                        const address = data.address || {};
                        const kelurahan = address.suburb || 'Tidak diketahui';
                        const kecamatan = address.city_district || 'Tidak diketahui';
                        
                        // Tampilkan kelurahan dan kecamatan
                        document.getElementById('kelurahan').textContent = kelurahan;
                        document.getElementById('kecamatan').textContent = kecamatan;
                    })
                    .catch(error => console.error('Geocoding error:', error));
            }, function(error) {
                alert('Gagal mendapatkan lokasi: ' + error.message);
            });
        } else {
            alert('Geolocation tidak didukung oleh browser ini.');
        }

        // Kirim form laporan
        document.getElementById('report-form').addEventListener('submit', function(event) {
            event.preventDefault();

            const name = document.getElementById('name').value;
            const phone = document.getElementById('phone').value;
            const details = document.getElementById('details').value;
            const coordinates = document.getElementById('coordinates').textContent;
            const kelurahan = document.getElementById('kelurahan').textContent;
            const kecamatan = document.getElementById('kecamatan').textContent;

            // Simpan laporan (misalnya, kirim ke server atau simpan ke file JSON)
            console.log({
                name: name,
                phone: phone,
                details: details,
                coordinates: coordinates,
                kelurahan: kelurahan,
                kecamatan: kecamatan
            });

            alert('Laporan berhasil dikirim!');
        });
    </script>
</body>
</html>
