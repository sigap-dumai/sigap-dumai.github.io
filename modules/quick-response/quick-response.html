<!-- modules/quick-response/quick-response.html -->
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perintah ke Unit Reaksi Cepat</title>
    <link rel="stylesheet" href="../../assets/css/styles.css"> <!-- Menggunakan CSS yang sudah ada -->
</head>
<body>
    <header>
        <div class="user-info">
            <span id="user-name"></span>
            <button id="logout-btn" onclick="logout()">Logout</button>
        </div>
    </header>

    <div class="quick-response-content">
        <h1>Perintah ke Unit Reaksi Cepat</h1>
        
        <form id="quick-response-form">
            <label for="unit">Unit:</label>
            <select id="unit" name="unit" required>
                <option value="unit1">Unit 1</option>
                <option value="unit2">Unit 2</option>
                <option value="unit3">Unit 3</option>
            </select>

            <label for="command">Perintah:</label>
            <textarea id="command" name="command" rows="4" required></textarea>

            <button type="submit" class="btn">Kirim Perintah</button>
        </form>
    </div>

    <script src="quick-response.js"></script> <!-- File JS jika diperlukan -->
</body>
</html>
