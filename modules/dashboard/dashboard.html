<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - SiGap Dumai</title>
    <link rel="stylesheet" href="../../assets/css/styles.css">
</head>
<body>
    <header>
        <div class="user-info">
            <!-- Menampilkan nama user yang login -->
            <span id="user-name"></span>
            <!-- Tombol Logout -->
            <button id="logout-btn" onclick="logout()">Logout</button>
        </div>
    </header>

    <div class="dashboard-content">
        <h1>Dashboard SiGap Dumai</h1>

        <!-- Statistik Laporan -->
        <section id="report-statistics">
            <h2>Statistik Laporan</h2>
            <div id="total-reports">
                <p><strong>Total Laporan: </strong><span id="total-report-count">0</span></p>
                <p><strong>Total Admin Laporan: </strong><span id="total-admin-report-count">0</span></p>
            </div>
        </section>

        <!-- Modul Admin Report -->
        <section id="admin-report-link">
            <h2>Modul Admin Report</h2>
            <p><a href="/modules/admin-reports/admin-reports.html" class="btn">Lihat Admin Report</a></p>
        </section>

        <!-- Modul Quick Response -->
        <section id="quick-response-link">
            <h2>Quick Response</h2>
            <p><a href="/modules/quick-response/quick-response.html" class="btn">Lihat Quick Response</a></p>
        </section>
    </div>

    <script>
        // Menampilkan nama user yang login
        document.getElementById('user-name').textContent = 'Hello, ' + localStorage.getItem('loggedInUser');

        // Fungsi untuk logout
        function logout() {
            localStorage.removeItem('loggedInUser');
            localStorage.removeItem('userRole');
            window.location.href = '/modules/login/login.html';  // Arahkan kembali ke halaman login
        }

        // Ambil data statistik laporan
        window.onload = function() {
            const userRole = localStorage.getItem('userRole');

            if (!userRole) {
                // Jika pengguna tidak login, arahkan ke login
                window.location.href = '/modules/login/login.html';
                return;
            }

            // Ambil statistik laporan dari file JSON (misalnya, data laporan diambil dari `reports.json`)
            fetch('../../json/reports.json')
                .then(response => response.json())
                .then(data => {
                    const totalReports = data.filter(report => report.type === 'report').length;
                    const totalAdminReports = data.filter(report => report.type === 'admin-report').length;

                    // Tampilkan statistik laporan
                    document.getElementById('total-report-count').textContent = totalReports;
                    document.getElementById('total-admin-report-count').textContent = totalAdminReports;
                })
                .catch(error => {
                    console.error('Error fetching reports data:', error);
                });
        };
    </script>
</body>
</html>
