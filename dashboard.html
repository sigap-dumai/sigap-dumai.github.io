<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SiGap Dumai – Dashboard</title>

    <!-- CSS Utama -->
    <link rel="stylesheet" href="/assets/css/dashboard.css" />

    <!-- Leaflet Map CDN -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
</head>
<body>
    <div class="app-shell">
        <!-- HEADER -->
        <header class="app-header">
            <div class="app-header-left">
                <button class="back-button" onclick="window.history.back()">Back</button>
            </div>
            <div class="app-header-right">
                <!-- Tombol Lonceng untuk Menampilkan Notifikasi -->
                <button id="notif-bell" class="notif-bell">
                    <img src="/assets/images/icon-bell.png" alt="Notifikasi">
                </button>
            </div>
        </header>

        <!-- Map Section -->
        <section class="map-section">
            <div id="map" style="height: 400px;"></div>
            <div class="map-legend">
                <button class="card-link" id="btn-posko-map">Lihat peta posko</button>
            </div>
        </section>

        <!-- Panel Notifikasi -->
        <div id="notifications-panel" class="notifications-panel">
            <!-- Pemberitahuan akan muncul di sini -->
        </div>
    </div>

    <!-- Scripts -->
    <script src="/assets/js/dashboard.js"></script>
    <script src="/assets/js/notifikasi.js"></script>
</body>
</html>
