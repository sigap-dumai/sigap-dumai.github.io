<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SiGap Dumai – Dashboard</title>

    <!-- CSS Utama -->
    <link rel="stylesheet" href="/assets/css/dashboard.css" />

    <!-- Leaflet Map CDN -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin=""
    />
</head>

<body>
<div class="app-shell">

    <!-- HEADER -->
    <header class="app-header">
        <div class="app-header-left">
            <img src="/images/sigap_dumai.png" class="header-logo" alt="Logo SiGap" />
            <div class="app-title">
                <span class="app-name">SiGap Dumai</span>
                <span class="app-subtitle">Dashboard Kebencanaan</span>
            </div>
        </div>

        <div class="app-header-right">
            <button id="notif-btn" class="icon-button" aria-label="Notifikasi">
                &#128276;
            </button>
        </div>
    </header>

    <!-- KONTEN UTAMA -->
    <main class="app-main">

        <!-- PETA -->
        <section class="map-section">
            <div id="map"></div>

            <div class="map-legend">
                <span class="legend-item hotspot">Hotspot</span>
                <span class="legend-item banjir">Banjir</span>
                <span class="legend-item posko">Posko</span>
            </div>
        </section>

        <!-- KARTU RINGKASAN -->
        <section class="cards-section">

            <div class="cards-row">
                <!-- Status -->
                <article class="info-card status" id="status-card">
                    <h3>Status Siaga Dumai</h3>
                    <p class="status-level">-</p>
                    <p class="status-updated">Memuat status...</p>
                    <button class="card-link" id="btn-status-detail">Lihat kriteria siaga</button>
                </article>

                <!-- Laporan -->
                <article class="info-card laporan" id="laporan-card">
                    <h3>Aktivitas Laporan (24 Jam)</h3>
                    <p class="laporan-total">- laporan</p>
                    <p class="laporan-detail">Memuat...</p>
                    <button class="card-link" id="btn-laporan-detail">Tinjau laporan detail</button>
                </article>
                <!-- Additional cards go here -->
            </div>
        </section>
    </main>

    <!-- BOTTOM NAV -->
    <nav class="bottom-nav">
        <a href="/dashboard.html" class="nav-item active">
            <span class="nav-label">Dasbor</span>
        </a>
        <a href="/informasi.html" class="nav-item">
            <span class="nav-label">Informasi/SOP</span>
        </a>
        <a href="/laporan.html" class="nav-item">
            <span class="nav-label">Lapor</span>
        </a>
    </nav>

    <!-- FAB -->
    <button id="lapor-btn" class="fab-report" aria-label="Lapor Warga">+</button>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="/assets/js/dashboard.js"></script>

</body>
</html>
