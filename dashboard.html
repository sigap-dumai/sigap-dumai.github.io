
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SiGap Dumai – Dashboard</title>
    <link rel="stylesheet" href="/assets/css/dashboard.css" />
</head>
<body>
    <div class="app-shell">
        <header class="app-header">
            <div class="app-header-left">
                <img src="/images/sigap_dumai.png" class="header-logo" alt="Logo SiGap" />
                <div class="app-title">
                    <span class="app-name">SiGap Dumai</span>
                    <span class="app-subtitle">Dashboard Kebencanaan</span>
                </div>
            </div>
        </header>

        <div class="dashboard-content">
            <div class="map-container">
                <h2>Peta Lokasi Bencana</h2>
                <div id="map" style="height: 300px; background-color: lightgray;">
                    <!-- Peta dummy, data bencana palsu -->
                    <p>Titik lokasi bencana: Dumai</p>
                </div>
            </div>

            <div class="notifications">
                <button id="notif-btn" onclick="showNotification()">Tampilkan Notifikasi</button>
                <div id="notif-message"></div>
            </div>

            <div class="report-section">
                <h3>Laporan Bencana</h3>
                <form id="reportForm">
                    <label for="jenis">Jenis Bencana:</label>
                    <input type="text" id="jenis" name="jenis" value="Gempa Bumi" disabled />
                    <label for="lokasi">Lokasi:</label>
                    <input type="text" id="lokasi" name="lokasi" value="Dumai" disabled />
                    <label for="deskripsi">Deskripsi:</label>
                    <textarea id="deskripsi" name="deskripsi" disabled>Terjadi gempa bumi di Dumai dengan kekuatan 5.0 SR.</textarea>
                    <button type="button" onclick="sendReport()">Kirim Laporan</button>
                </form>
            </div>
        </div>
    </div>

    <script src="/assets/js/dummy.js"></script>
</body>
</html>
