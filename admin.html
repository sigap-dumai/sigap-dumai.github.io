<!DOCTYPE html>
<html lang="id">
<head>
    <base href=".">
    <title>Admin TRC - SIGAP Dumai</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/main.css">
    <style>
        /* CSS Khusus Admin agar tabel lebih rapi di HP */
        .table-responsive { font-size: 13px; }
        .btn-action { margin-right: 2px; margin-bottom: 2px; }
    </style>
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark p-3 shadow-sm">
        <div class="d-flex align-items-center">
            <span class="navbar-brand mb-0 h1"><i class="fas fa-user-shield me-2"></i>Admin TRC</span>
            <small class="text-white-50 ms-3 border-start ps-3" id="userDisplay">Halo, User</small>
        </div>
        <button id="btnLogout" class="btn btn-outline-danger btn-sm">
            <i class="fas fa-sign-out-alt"></i> Keluar
        </button>
    </nav>

    <div class="container mt-4">
        <div class="card border-0 shadow-sm">
            <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
                <h5 class="m-0 fw-bold text-dark">Laporan Masuk</h5>
                <span id="countLaporan" class="badge bg-danger rounded-pill">0</span>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-striped table-hover mb-0 align-middle" id="tabelLaporan">
                        <thead class="table-dark">
                            <tr>
                                <th>Waktu</th>
                                <th>Jenis</th>
                                <th>Lokasi / Wilayah</th>
                                <th>Status</th> <th>Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="laporanBody">
                            </tbody>
                    </table>
                </div>
            </div>
        </div>
        
        <div class="text-center mt-4 text-muted small">
            SIGAP Dumai Admin Panel v1.2
        </div>
    </div>

    <script src="assets/js/modules/trc.js"></script>
</body>
</html>
