<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SiGap-Dumai</title>
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>

    <!-- HEADER -->
    <div id="header-container"></div>

    <main class="landing">
        <div class="landing-content">
            <h1>Selamat Datang di Aplikasi SiGap-Dumai</h1>
            <p class="subtitle">
                Sistem Informasi Gawat Darurat Bencana Kota Dumai — Media pelaporan bencana dan monitoring kawasan.
            </p>

            <a href="modules/login/login.html" class="landing-login-btn">Masuk ke Sistem</a>
        </div>
    </main>

    <!-- FOOTER -->
    <div id="footer-container"></div>

    <script>
        // Load Header
        fetch('partials/header.html')
            .then(r => r.text())
            .then(html => document.getElementById("header-container").innerHTML = html);

        // Load Footer
        fetch('partials/footer.html')
            .then(r => r.text())
            .then(html => document.getElementById("footer-container").innerHTML = html);
    </script>

</body>
</html>
