<!DOCTYPE html>
<html lang="id">
<head>
    <base href=".">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SIGAP Dumai - Live Dashboard</title>
    <link rel="icon" type="image/png" href="assets/img/sigap_dumai.png"> 
    
    <link rel="stylesheet" href="assets/css/main.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* CSS LAMA */
        .marquee-container { background: #d63031; color: white; padding: 5px; font-size: 12px; white-space: nowrap; overflow: hidden; position: relative; }
        .marquee-text { display: inline-block; padding-left: 100%; animation: marquee 15s linear infinite; }
        @keyframes marquee { 0% { transform: translate(0, 0); } 100% { transform: translate(-100%, 0); } }
        
        .gempa-item { font-size: 11px; border-bottom: 1px solid #eee; padding: 5px 0; }
        .gempa-item:last-child { border-bottom: none; }
        .gempa-mag { font-weight: bold; color: #d63031; background: #ffeaa7; padding: 1px 4px; border-radius: 4px; margin-right: 5px; }
        
        .news-item { padding: 10px; border-bottom: 1px solid #f0f0f0; display: flex; gap: 10px; }
        .news-item:last-child { border-bottom: none; }
        .news-thumb { width: 60px; height: 60px; background: #eee; border-radius: 8px; object-fit: cover; }
        .news-content h6 { font-size: 13px; font-weight: bold; margin: 0 0 3px 0; color: #333; }
        .news-content p { font-size: 11px; color: #666; margin: 0; line-height: 1.3; }
        .news-date { font-size: 10px; color: #999; margin-top: 3px; display: block; }
    </style>
</head>
<body class="with-nav">
    
    <div class="app-header d-flex justify-content-between align-items-center">
        <div class="d-flex align-items-center gap-2">
            <div class="app-logo">
                <img src="assets/img/sigap_dumai.png" alt="Logo" onerror="this.src='https://via.placeholder.com/40'">
            </div>
            <div>
                <h6 class="m-0 fw-bold text-dark">SiGap Dumai</h6>
                <small class="text-muted" style="font-size: 11px;">BPBD Kota Dumai</small>
            </div>
        </div>
        <div class="d-flex gap-2">
            <button id="btnCekRadius" class="btn btn-warning btn-sm rounded-circle shadow-sm" title="Cek Bahaya Radius 1KM">
                <i class="fas fa-bullseye"></i>
            </button>
            <button id="btnNotifikasi" class="btn btn-light btn-sm rounded-circle shadow-sm position-relative">
                <i class="fas fa-bell text-warning"></i>
                <span class="position-absolute top-0 start-100 translate-middle p-1 bg-danger border border-light rounded-circle"></span>
            </button>
        </div>
    </div>

    <div class="marquee-container">
        <span class="marquee-text" id="notifikasi-jalan">⚠️ MEMUAT DATA PERINGATAN DINI...</span>
    </div>

    <div class="container pb-3">
        <div class="map-container">
            <div id="map"></div>
            <div class="map-legend-floating">
                <span><span class="dot dot-posko"></span> Posko</span>
                <span><span class="dot dot-hotspot"></span> Api</span>
                <span><span class="dot" style="background: orange;"></span> Angin</span>
                <span><span class="dot" style="background: #1e90ff;"></span> Banjir</span>
            </div>
        </div>

        <div class="row g-3 mt-1">
            <div class="col-6">
                <div class="stat-card">
                    <div class="stat-title">Status Siaga</div>
                    <div id="status-text" class="fw-bold fs-5 mb-1 text-secondary">Loading..</div>
                    <div id="status-desc" class="stat-desc">Menunggu data...</div>
                </div>
            </div>
            <div class="col-6">
                <div class="stat-card border-start border-4 border-info">
                    <div class="stat-title">Cuaca Dumai</div>
                    <div class="d-flex align-items-center gap-2 my-1">
                        <i id="cuaca-icon" class="fas fa-sync fa-spin text-info fs-4"></i>
                        <span id="cuaca-suhu" class="fw-bold fs-5">--°C</span>
                    </div>
                    <div id="cuaca-desc" class="stat-desc">Sinkronisasi...</div>
                </div>
            </div>
            <div class="col-6">
                <div class="stat-card">
                    <div class="d-flex justify-content-between"><div class="stat-title">Laporan</div><i class="fas fa-file-alt text-muted"></i></div>
                    <div class="stat-value text-primary" id="jml-laporan">0</div>
                    <div class="stat-desc mb-1">Masuk (24 Jam)</div>
                    <a href="login.html" class="btn btn-outline-primary btn-sm rounded-pill" style="font-size: 10px; padding: 2px 8px;">
                        <i class="fas fa-lock"></i> Login Admin
                    </a>
                </div>
            </div>
            <div class="col-6">
                <div class="stat-card border-start border-4 border-danger">
                    <div class="stat-title">Gempa Terkini</div>
                    <div id="list-gempa" style="min-height: 50px;">
                        <small class="text-muted">Mengambil data BMKG...</small>
                    </div>
                </div>
            </div>
            <div class="col-12">
                <div class="card border-0 shadow-sm">
                    <div class="card-header bg-white py-2"><h6 class="m-0 fw-bold text-dark"><i class="fas fa-newspaper text-danger me-2"></i>Info Terkini</h6></div>
                    <div class="card-body p-0" id="berita-container"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="bottom-nav">
        <a href="index.html" class="nav-item-custom active">Dasbor</a>
        <a href="panduan.html" class="nav-item-custom">Petunjuk</a>
        <a href="lapor.html" class="nav-item-custom">Lapor</a>
    </div>

    <script src="config.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="assets/js/modules/dashboard.js"></script>
</body>
</html>
