<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SiGap-Dumai</title>
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
    <!-- Header -->
    <div id="header-container"></div>

    <main>
        <h2>Selamat datang di Aplikasi SiGap-Dumai</h2>
        <p>Portal untuk laporan bencana dan penanggulangan darurat di Kota Dumai.</p>
        
        <section id="login-section">
            <h3>Login</h3>
            <form action="modules/login/login.html">
                <button type="submit">Login untuk melaporkan kejadian</button>
            </form>
        </section>
    </main>

    <!-- Footer -->
    <div id="footer-container"></div>

    <script src="assets/js/main.js"></script>
    <script>
        // Menyisipkan header dan footer ke halaman
        document.getElementById("header-container").innerHTML = document.getElementById("header-template").innerHTML;
        document.getElementById("footer-container").innerHTML = document.getElementById("footer-template").innerHTML;
    </script>
</body>
</html>

<!-- Template untuk Header -->
<template id="header-template">
    <header>
        <div class="logo-container">
            <img src="images/dumai_idaman.png" alt="Logo Dumai Idaman" class="logo">
            <img src="images/sigap_dumai.png" alt="Logo SiGap-Dumai" class="logo">
            <img src="images/asn.png" alt="Logo ASN" class="logo">
        </div>
        <div class="app-title">
            <h1>Aplikasi SiGap-Dumai</h1>
        </div>
        <nav>
            <ul>
                <li><a href="modules/home/home.html">Home</a></li>
                <li><a href="modules/login/login.html">Login</a></li>
            </ul>
        </nav>
    </header>
</template>

<!-- Template untuk Footer -->
<template id="footer-template">
    <footer>
        <p>&copy; 2025 BPBD Dumai. Semua hak dilindungi.</p>
    </footer>
</template>
