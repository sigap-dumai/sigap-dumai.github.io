<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SiGap-Dumai</title>
    <link rel="stylesheet" href="/assets/css/styles.css">
    <script src="/assets/js/main.js"></script>
</head>
<body>
    <div id="header-container"></div>
    
    <section class="landing">
        <div class="landing-content">
            <h1>SiGap-Dumai</h1>
            <p>Aplikasi SiGap-Dumai membantu Anda mendapatkan informasi darurat dan melaporkan kejadian di wilayah Kota Dumai.</p>

            <!-- Card dan modul lainnya -->

            <div id="adminLoginButton" style="display:none;">
                <a href="/modules/admin-reports/admin-reports.html" class="landing-login-btn">Login Admin</a>
            </div>

            <div id="userLoginButton" style="display:none;">
                <a href="/modules/login/login.html" class="landing-login-btn">Login Admin/Operator</a>
            </div>
        </div>
    </section>

    <div id="footer-container"></div>

    <script>
        // Cek status login dan peran pengguna
        window.onload = function() {
            const userRole = localStorage.getItem('userRole');
            if (userRole === 'admin_kecamatan') {
                document.getElementById('adminLoginButton').style.display = 'block';
                document.getElementById('userLoginButton').style.display = 'none';
            } else {
                document.getElementById('userLoginButton').style.display = 'block';
                document.getElementById('adminLoginButton').style.display = 'none';
            }
        };
    </script>
</body>
</html>
