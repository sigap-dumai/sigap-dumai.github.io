<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SiGap-Dumai</title>
    <!-- Menggunakan Absolute Path -->
    <link href="/assets/fonts/Roboto-VariableFont_wdth,wght.ttf" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/styles.css">
</head>
<body>
    <header>
        <div class="logo-container">
            <!-- Logo SiGap-Dumai -->
            <img src="/images/sigap_dumai.png" alt="SiGap-Dumai Logo" class="logo-img">
        </div>
    </header>

    <!-- Landing Page Section -->
    <section class="landing">
        <div class="landing-content">
            <h1>SiGap-Dumai</h1>
            <p class="subtitle">Aplikasi SiGap-Dumai membantu Anda mendapatkan informasi darurat dengan cepat dan mudah.</p>

            <!-- Tombol untuk Arahkan ke Halaman Login -->
            <a href="/modules/login/login.html" class="landing-login-btn">Masuk</a>
        </div>
    </section>

    <!-- 5 Laporan Terakhir -->
    <section class="reports">
        <h2>Laporan Terbaru</h2>
        <div class="report-cards" id="report-cards-container">
            <!-- Laporan akan ditampilkan di sini -->
        </div>
    </section>

    <footer>
        <p>&copy; 2025 SiGap-Dumai. All rights reserved.</p>
    </footer>

    <script src="/assets/js/main.js"></script>
    <script>
        // Fungsi untuk mengambil dan menampilkan 5 laporan terakhir dari localStorage
        function displayRecentReports() {
            const reports = JSON.parse(localStorage.getItem('pendingReports')) || [];  // Ambil laporan dari localStorage
            const recentReports = reports.slice(-5).reverse();  // Ambil 5 laporan terakhir, urutkan terbalik
            
            const reportContainer = document.getElementById('report-cards-container');
            recentReports.forEach(report => {
                const reportCard = document.createElement('div');
                reportCard.classList.add('report-card');
                reportCard.innerHTML = `
                    <h3>${report.title}</h3>
                    <p>${report.description}</p>
                    <span class="report-date">${new Date(report.createdAt).toLocaleDateString()}</span>
                `;
                reportContainer.appendChild(reportCard);
            });
        }

        // Memanggil fungsi untuk menampilkan laporan setelah halaman dimuat
        window.onload = displayRecentReports;
    </script>
</body>
</html>
