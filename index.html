<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SiGap-Dumai</title>
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
    <!-- Header -->
    <div id="header-container"></div>

    <main>
        <h2>Selamat datang di Aplikasi SiGap-Dumai</h2>
        <p>Portal untuk laporan bencana dan penanggulangan darurat di Kota Dumai.</p>
        
        <section id="login-section">
            <h3>Login</h3>
            <form action="modules/login/login.html">
                <button type="submit">Login untuk melaporkan kejadian</button>
            </form>
        </section>
    </main>

    <!-- Footer -->
    <div id="footer-container"></div>

    <script src="assets/js/main.js"></script>
    <script>
        // Menyisipkan header dan footer ke halaman
        fetch('partials/header.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById("header-container").innerHTML = data;
            });

        fetch('partials/footer.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById("footer-container").innerHTML = data;
            });
    </script>
</body>
</html>
