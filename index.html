<!DOCTYPE html>
<html lang="id">
<head>
    <base href=".">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SIGAP Dumai</title>
    <link rel="stylesheet" href="assets/css/main.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="with-nav">
    <div class="app-header d-flex justify-content-between align-items-center">
        <div class="d-flex align-items-center gap-2">
            <div class="app-logo">
                <img src="assets/img/sigap_dumai.png" alt="Logo" onerror="this.src='https://via.placeholder.com/40'">
            </div>
            <div>
                <h6 class="m-0 fw-bold text-dark">SiGap Dumai</h6>
                <small class="text-muted" style="font-size: 11px;">BPBD Kota Dumai</small>
            </div>
        </div>
        <button class="btn btn-light btn-sm rounded-circle shadow-sm">
            <i class="fas fa-bell text-warning"></i>
        </button>
    </div>

    <div class="container pb-3">
        <div class="map-container">
            <div id="map"></div>
            <div class="map-legend-floating">
                <span><span class="dot dot-hotspot"></span> Hotspot</span>
                <span><span class="dot dot-banjir"></span> Banjir</span>
                <span><span class="dot dot-posko"></span> Posko</span>
            </div>
        </div>

        <div class="row g-3 mt-1">
            <div class="col-6">
                <div class="stat-card">
                    <div class="stat-title">Status Siaga</div>
                    <div class="text-danger fw-bold fs-5 mb-1">WASPADA</div>
                    <div class="stat-desc">Potensi Karhutla Tinggi</div>
                    <a href="panduan.html" class="stat-btn">Lihat kriteria</a>
                </div>
            </div>
            <div class="col-6">
                <div class="stat-card">
                    <div class="stat-title">Laporan (24j)</div>
                    <div class="stat-value text-primary">3 <small class="fs-6 text-muted">masuk</small></div>
                    <div class="stat-desc">Menunggu respon</div>
                    <a href="login.html" class="stat-btn">Login Petugas</a>
                </div>
            </div>
            <div class="col-6">
                <div class="stat-card border-start border-4 border-info">
                    <div class="stat-title">Cuaca Dumai</div>
                    <div class="d-flex align-items-center gap-2 my-1">
                        <i class="fas fa-cloud-sun text-warning fs-4"></i>
                        <span class="fw-bold fs-5">32°C</span>
                    </div>
                    <div class="stat-desc">Cerah Berawan</div>
                </div>
            </div>
            <div class="col-6">
                <div class="stat-card border-start border-4 border-warning">
                    <div class="stat-title">Hotspot Riau</div>
                    <div class="d-flex align-items-center gap-2 my-1">
                        <i class="fas fa-fire text-danger fs-4"></i>
                        <span class="fw-bold fs-5">12</span>
                    </div>
                    <div class="stat-desc">Titik terpantau</div>
                </div>
            </div>
        </div>
    </div>

    <div class="bottom-nav">
        <a href="index.html" class="nav-item-custom active">Dasbor</a>
        <a href="panduan.html" class="nav-item-custom">Petunjuk</a>
        <a href="lapor.html" class="nav-item-custom">Lapor</a>
    </div>

    <script src="config.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="assets/js/modules/dashboard.js"></script>
</body>
</html>
